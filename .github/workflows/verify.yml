name: verify

# Deliberately no `push` trigger for feature branches — every change merges
# through a PR (branch protection requires the `pull_request` run below
# anyway), so a duplicate `push`-triggered run of the same commit added no
# real coverage, just doubled CI minutes. Diverges from
# tesla-powerwall-automation's/wake-on-lan's own verify.yml, which both
# still have the redundant push trigger — a deliberate choice for this repo,
# not an oversight.
on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Prettier
        id: prettier-run
        run: bun prettier

      - name: Run Eslint
        id: eslint-run
        run: bun eslint

      - name: Run Stylelint
        id: stylelint-run
        run: bun stylelint

      - name: Run Tsc
        id: tsc-run
        run: bun tsc

      - name: Run Test Coverage
        id: test-coverage-run
        run: bun test:coverage

  # A separate job, not a step in `build` above — `bun audit` only needs the
  # lockfile/installed deps, nothing `build`'s steps produce, and it's by far
  # the slowest single step (3-5 min vs. build's ~1.5 min total). Jobs run
  # concurrently by default (no `needs:` between them), so this overlaps with
  # `build` instead of adding to it — PR wait time drops from sum to max.
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Audit Dependencies
        run: bun run audit
